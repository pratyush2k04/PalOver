<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content class="confirm-dialog__content">
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-stroked-button (click)="onCancel()">Cancel</button>
  <button
    type="button"
    mat-flat-button
    [color]="data.isDestructive ? 'warn' : 'primary'"
    (click)="onConfirm()"
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
