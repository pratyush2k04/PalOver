<h2 class="app-dialog__title">{{ data.title }}</h2>

<div class="app-dialog__content confirm-dialog__content">
  <p>{{ data.message }}</p>
</div>

<div class="app-dialog__actions">
  <button type="button" class="app-button app-button--stroked" (click)="onCancel()">Cancel</button>
  <button
    type="button"
    class="app-button"
    [class.app-button--warn]="data.isDestructive"
    [class.app-button--flat]="!data.isDestructive"
    (click)="onConfirm()"
  >
    {{ data.confirmLabel }}
  </button>
</div>
