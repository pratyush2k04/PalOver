<div class="demo-page">
  <div class="demo-harness-card">
    <h2>Document Repository Demo Harness</h2>
    <p class="subtitle">Enter an Engagement ID to test rendering the document component.</p>

    <div class="harness-form">
      <div class="form-group">
        <label for="demo-engagement-id">Engagement ID</label>
        <input
          id="demo-engagement-id"
          type="number"
          min="1"
          class="form-control"
          [value]="inputEngagementId()"
          (input)="onEngagementIdChange($any($event.target).value)"
        />
      </div>

      <button type="button" class="btn-load" (click)="loadEngagement()">
        Load Documents
      </button>
    </div>
  </div>

  <div class="demo-component-preview">
    @if (activeEngagementId()) {
      <app-engagement-documents [engagementId]="activeEngagementId()"></app-engagement-documents>
    }
  </div>
</div>
