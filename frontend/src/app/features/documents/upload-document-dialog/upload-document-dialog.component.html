<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">Upload document</h3>
      <app-button type="button" variant="icon" ariaLabel="Close" (click)="onClose()">&times;</app-button>
    </div>

    <div class="modal-body">
      @if (errorMessage()) {
        <app-alert>{{ errorMessage() }}</app-alert>
      }

      <div class="form-group">
        <label for="file-picker">Select File</label>
        <input
          id="file-picker"
          type="file"
          class="file-input"
          (change)="onFileSelected($event)"
        />
      </div>

      <div class="form-group">
        <label for="file-name">File name (simulated)</label>
        <input
          id="file-name"
          type="text"
          class="form-control"
          [value]="simulatedFileName()"
          (input)="onSimulatedNameChange($any($event.target).value)"
          placeholder="e.g. Document.pdf"
        />
      </div>

      <div class="form-group">
        <label for="doc-category">Category</label>
        <select
          id="doc-category"
          class="form-control"
          [value]="selectedCategoryId() || ''"
          (change)="onCategoryChange($any($event.target).value)"
        >
          @for (cat of categories(); track cat.id) {
            <option [value]="cat.id">{{ cat.categoryName }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="doc-visibility">Visibility</label>
        <select
          id="doc-visibility"
          class="form-control"
          [value]="selectedVisibility()"
          (change)="onVisibilityChange($any($event.target).value)"
        >
          <option value="Team-wide">Team-wide</option>
          <option value="Restricted">Restricted (PM only)</option>
        </select>
      </div>

      <p class="format-note">
        Accepted formats: PDF, DOCX, XLSX, PPTX, PNG, JPG, MSG, EML up to 50 MB.
      </p>
    </div>

    <div class="modal-footer">
      <app-button type="button" variant="stroked" [disabled]="isUploading()" (click)="onClose()">
        Cancel
      </app-button>
      <app-button type="button" variant="accent" [loading]="isUploading()" (click)="onSubmit()">
        Upload
      </app-button>
    </div>
  </div>
</div>
