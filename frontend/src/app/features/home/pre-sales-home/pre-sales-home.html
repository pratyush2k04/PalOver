@if (workspace(); as ws) {
  <div class="home-workspace">
    <h1>{{ ws.title }}</h1>

    <app-welcome-banner [welcomeMessage]="ws.welcomeMessage" />

    @if (user(); as currentUser) {
      <app-role-badge [role]="currentUser.role" />
    }

    <app-workspace-placeholder [emptyState]="ws.emptyState" />
  </div>
}
