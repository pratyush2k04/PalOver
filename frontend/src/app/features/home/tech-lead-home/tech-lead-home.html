@if (workspace(); as ws) {
  <div class="home-workspace">
    <app-page-header [title]="ws.welcomeMessage" />
    
    @if (ws.cards && ws.cards.length > 0) {
      <div class="kpi-cards-grid">
        @for (card of ws.cards; track card.title) {
          <app-dashboard-kpi-card [card]="card"></app-dashboard-kpi-card>
        }
      </div>
    }

    <!-- Row 2: Main Content (2-Column Layout) -->
    <div class="main-content-grid">
      <div class="main-left">
        <app-dashboard-engagements-list [engagements]="ws.engagements"></app-dashboard-engagements-list>
      </div>
      <div class="main-right">
        <app-dashboard-critical-blockers [blockers]="ws.criticalBlockers"></app-dashboard-critical-blockers>
      </div>
    </div>
  </div>
}
