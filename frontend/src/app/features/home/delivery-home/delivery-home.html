<div class="home-workspace">
  <app-page-header [title]="workspace()?.welcomeMessage || ''" />

  @if (workspace(); as data) {
    <!-- Row 1: KPI Cards -->
    <div class="kpi-cards-grid">
      @for (card of data.cards; track card.title) {
        <app-dashboard-kpi-card [card]="card"></app-dashboard-kpi-card>
      }
    </div>

    <!-- Row 2: Main Content (2-Column Layout) -->
    <div class="main-content-grid">
      <div class="main-left delivery-sections">
        <div class="delivery-section">
          <app-dashboard-engagements-list
            title="Project Manager of Engagements"
            [engagements]="pmEngagements()"
            [totalCount]="pmEngagements().length"
          ></app-dashboard-engagements-list>
        </div>

        <div class="delivery-section">
          <app-dashboard-engagements-list
            title="Tech Lead of Engagements"
            [engagements]="tlEngagements()"
            [totalCount]="tlEngagements().length"
          ></app-dashboard-engagements-list>
        </div>
      </div>
      <div class="main-right">
        <app-dashboard-critical-blockers
          [blockers]="data.criticalBlockers"
          [totalCount]="data.totalCriticalBlockers"
        ></app-dashboard-critical-blockers>
      </div>
    </div>
  }
</div>
