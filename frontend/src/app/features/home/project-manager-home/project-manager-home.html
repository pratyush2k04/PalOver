<div class="dashboard-container">
  
  <div class="dashboard-header">
    <h1 class="page-title">{{ workspace()?.title }}</h1>
    <p class="welcome-msg">{{ workspace()?.welcomeMessage }}</p>
  </div>

  @if (workspace(); as data) {
    <!-- Row 1: KPI Cards -->
    <div class="cards-grid">
      @for (card of data.cards; track card.title) {
        <app-dashboard-kpi-card [card]="card"></app-dashboard-kpi-card>
      }
    </div>

    <!-- Row 2: Main Content (2-Column Layout) -->
    <div class="main-content-grid">
      <div class="main-left">
        <app-dashboard-engagements-list [engagements]="data.engagements"></app-dashboard-engagements-list>
      </div>
      <div class="main-right">
        <app-dashboard-critical-blockers [blockers]="data.criticalBlockers"></app-dashboard-critical-blockers>
      </div>
    </div>
  }

</div>
