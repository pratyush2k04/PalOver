<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="logo.png" alt="paltech logo" class="login-logo" />
      <h1 class="hub-title">Project Readiness Hub</h1>
      <p class="login-desc">Log in to continue to your workspace.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      @if (errorMessage()) {
        <app-alert>{{ errorMessage() }}</app-alert>
      }

      <app-input
        id="email"
        type="email"
        label="Work Email"
        placeholder="you@company.com"
        formControlName="email"
        [errorMessages]="{ required: 'Email is required.', email: 'Enter a valid work email address.' }"
      />

      <app-input
        id="password"
        type="password"
        label="Password"
        placeholder="Enter password"
        formControlName="password"
        [errorMessages]="{ required: 'Password is required.' }"
      />

      <app-button
        type="submit"
        variant="flat"
        [fullWidth]="true"
        [loading]="isLoading()"
        [disabled]="isLoading()"
        class="login-submit-btn"
      >
        Log In
      </app-button>
    </form>
  </div>
</div>
