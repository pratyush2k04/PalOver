<div class="engagements-page">
  <div class="page-header">
    <!-- <h2>Engagements</h2> -->
    <app-button type="button" variant="accent" (click)="openModal()">+ Mark SOW Signed</app-button>
  </div>

  @if (warnings().length > 0) {
  <app-alert variant="warning">
    @for (warning of warnings(); track warning) {
    <div>{{ warning }}</div>
    }
  </app-alert>
  }

  @if (showModal()) {
  <div class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Mark SOW Signed</h3>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close">&times;</button>
      </div>

      <form [formGroup]="engagementForm" (ngSubmit)="onSubmit()" novalidate>
        @if (errorMessage()) {
        <app-alert variant="danger">{{ errorMessage() }}</app-alert>
        }

        <div class="form-group">
          <app-input
            id="engagementName"
            label="Engagement name"
            formControlName="engagementName"
            [errorMessages]="{ required: 'Engagement name is required.' }"
          />
        </div>

        <div class="form-group">
          <app-input
            id="clientName"
            label="Client name"
            formControlName="clientName"
            [errorMessages]="{ required: 'Client name is required.' }"
          />
        </div>

        <div class="form-group">
          <app-input id="engagementDescription" label="Engagement description" formControlName="engagementDescription" />
        </div>

        <div class="form-group">
          <app-select
            id="engagementTypeId"
            label="Nature"
            formControlName="engagementTypeId"
            [options]="engagementTypeOptions()"
            [errorMessages]="{ required: 'Nature is required.' }"
          />
        </div>

        <div class="form-group">
          <app-select
            id="commercialModelId"
            label="Commercial model"
            formControlName="commercialModelId"
            [options]="commercialModelOptions()"
            [errorMessages]="{ required: 'Commercial model is required.' }"
          />
        </div>

        <div class="form-group">
          <app-input
            id="kickoffDate"
            type="date"
            label="Target kickoff date"
            formControlName="kickoffDate"
            [errorMessages]="{ required: 'Target kickoff date is required.' }"
          />
        </div>

        <div class="form-group">
          <app-input
            id="billingStartDate"
            type="date"
            label="Billing start date"
            formControlName="billingStartDate"
            [errorMessages]="{ required: 'Billing start date is required.' }"
            [extraError]="engagementForm.errors?.['billingBeforeKickoff'] ? 'Billing start cannot be before the kickoff date.' : null"
          />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
            @if (isSubmitting()) {
            <span class="spinner"></span> Creating...
            } @else {
            Create Engagement
            }
          </button>
        </div>
      </form>
    </div>
  </div>
  }
</div>
