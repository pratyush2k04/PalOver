<div class="engagements-page">
  <div class="page-header">
    <!-- <h2>Engagements</h2> -->
    <app-button type="button" variant="accent" (click)="openModal()">+ Mark SOW Signed</app-button>
  </div>

  @if (warnings().length > 0) {
    <app-alert variant="warning">
      @for (warning of warnings(); track warning) {
        <div>{{ warning }}</div>
      }
    </app-alert>
  }

  @if (showModal()) {
    <div class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Mark SOW Signed</h3>
          <app-button type="button" variant="icon" ariaLabel="Close" (click)="closeModal()">&times;</app-button>
        </div>

        <form [formGroup]="engagementForm" (ngSubmit)="onSubmit()" novalidate>
          @if (errorMessage()) {
            <app-alert>{{ errorMessage() }}</app-alert>
          }

          <app-input
            id="engagementName"
            label="Engagement name"
            formControlName="engagementName"
            [errorMessages]="{ required: 'Engagement name is required.' }"
          />

          <app-input
            id="clientName"
            label="Client name"
            formControlName="clientName"
            [errorMessages]="{ required: 'Client name is required.' }"
          />

          <app-input
            id="engagementDescription"
            label="Engagement description"
            formControlName="engagementDescription"
            [errorMessages]="{ required: 'Engagement description is required.' }"
          />

          <app-select
            id="engagementTypeId"
            label="Nature"
            formControlName="engagementTypeId"
            [options]="engagementTypeOptions()"
            [errorMessages]="{ required: 'Nature is required.' }"
          />

          <app-select
            id="commercialModelId"
            label="Commercial model"
            formControlName="commercialModelId"
            [options]="commercialModelOptions()"
            [errorMessages]="{ required: 'Commercial model is required.' }"
          />

          <app-input
            id="kickoffDate"
            type="date"
            label="Target kickoff date"
            formControlName="kickoffDate"
            [errorMessages]="{ required: 'Target kickoff date is required.' }"
          />

          <app-input
            id="billingStartDate"
            type="date"
            label="Billing start date"
            formControlName="billingStartDate"
            [errorMessages]="{ required: 'Billing start date is required.' }"
            [extraError]="billingBeforeKickoffError"
          />

          <div class="modal-actions">
            <app-button type="button" variant="stroked" (click)="closeModal()">Cancel</app-button>
            <app-button type="submit" variant="accent" [loading]="isSubmitting()">
              {{ isSubmitting() ? 'Creating...' : 'Create Engagement' }}
            </app-button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
