<div class="technical-readiness-container">
  <!-- Day-1 Readiness Banner -->
  <div class="readiness-banner" [ngClass]="{ 'ready': isDayOneReady() }">
    <div class="banner-content">
      <div class="banner-icon">
        <span inlineSVG="assets/svgs/clock.svg"></span>
      </div>
      <div class="banner-text">
        @if (!isDayOneReady()) {
          <strong>Not yet able to start Day-1</strong>
        } @else {
          <strong>Ready for Day-1</strong>
        }
        <span> &mdash; access {{ accessGrantedCount() }}/{{ accessTotalCount() }} granted, tooling {{ toolingReadyCount() }}/{{ toolingTotalCount() }} ready</span>
      </div>
    </div>
  </div>

  <!-- Access Tracker Section -->
  @if (engagementId()) {
    <div class="readiness-section">
      <app-access-tracker
        [engagementId]="engagementId()!"
        (itemsUpdated)="onAccessItemsUpdated($event)">
      </app-access-tracker>
    </div>

    <div class="readiness-section">
      <app-environment-tooling
        [engagementId]="engagementId()!"
        (itemsUpdated)="onToolingItemsUpdated($event)">
      </app-environment-tooling>
    </div>
  }
</div>
