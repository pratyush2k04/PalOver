<h2 class="app-dialog__title">Client Details</h2>

<div class="app-dialog__content client-details-content">
  <div class="detail-group">
    <h3>Name</h3>
    <p>{{ data.name }}</p>
  </div>

  <div class="detail-group">
    <h3>Role</h3>
    <p>{{ data.role }}</p>
  </div>

  @if (data.email) {
    <div class="detail-group">
      <h3>Email</h3>
      <p><a [href]="'mailto:' + data.email">{{ data.email }}</a></p>
    </div>
  }

  @if (data.clientBackground) {
    <div class="detail-group">
      <h3>Client Background</h3>
      <p class="pre-wrap">{{ data.clientBackground }}</p>
    </div>
  }

  @if (data.clientSentiment) {
    <div class="detail-group">
      <h3>Client Behaviour</h3>
      <p>{{ data.clientSentiment }}</p>
    </div>
  }

</div>

<div class="app-dialog__actions">
  <app-button type="button" variant="flat" (click)="onClose()">Close</app-button>
</div>
