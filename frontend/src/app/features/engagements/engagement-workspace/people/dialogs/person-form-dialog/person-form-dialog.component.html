<h2 class="app-dialog__title">{{ isEditing ? 'Edit Person' : 'Add Person' }}</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="app-dialog__content">
    <app-input
      id="personName"
      label="Name"
      [required]="true"
      placeholder="e.g. John Doe"
      formControlName="name"
    />

    <app-input
      id="personRole"
      label="Role"
      [required]="true"
      placeholder="e.g. Tech Lead / Sponsor"
      formControlName="role"
    />

    <app-input
      id="personEmail"
      label="Email"
      placeholder="e.g. name@client.com"
      formControlName="email"
    />

    <app-textarea
      id="clientBackground"
      label="Client Background"
      placeholder="e.g. History with the project, communication preferences..."
      formControlName="clientBackground"
    />

    <app-input
      id="clientSentiment"
      label="Client Sentiment"
      placeholder="e.g. Warm , Neutral, Cold..."
      formControlName="clientSentiment"
    />
  </div>

  <div class="app-dialog__actions">
    <app-button type="button" variant="stroked" (click)="onCancel()">Cancel</app-button>
    <app-button type="submit" variant="flat">
      {{ isEditing ? 'Update' : 'Add' }}
    </app-button>
  </div>
</form>
