<h2 class="app-dialog__title">{{ isEditing ? 'Edit Assumption' : 'Add Assumption' }}</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="app-dialog__content">
    <app-textarea
      id="description"
      label="Description"
      placeholder="Enter your assumption..."
      [required]="true"
      formControlName="description"
    />

    <app-textarea
      id="rationale"
      label="Rationale"
      placeholder="Give the reason..."
      [required]="true"
      formControlName="rationale"
    />
  </div>

  <div class="app-dialog__actions">
    <app-button type="button" variant="stroked" (click)="onCancel()">Cancel</app-button>
    <app-button type="submit" variant="flat">
      {{ isEditing ? 'Update' : 'Add' }}
    </app-button>
  </div>
</form>
