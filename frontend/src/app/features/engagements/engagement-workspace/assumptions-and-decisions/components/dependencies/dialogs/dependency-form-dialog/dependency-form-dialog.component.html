<div class="dialog-container">
  <div class="dialog-header">
    <h3>{{ isEditing ? 'Edit Dependency' : 'Add Dependency' }}</h3>
    <app-button type="button" variant="icon" ariaLabel="Close" (click)="onCancel()">&times;</app-button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="dialog-body">
      <div class="form-group">
        <app-textarea id="description" label="Description" placeholder="Enter dependency description..."
          formControlName="description" />
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <app-select id="type" label="Type" [options]="typeOptions" formControlName="type" />
        </div>
        <div class="form-group flex-1">
          <app-select id="ownerId" label="Owner" [options]="ownerOptions()" formControlName="ownerId" placeholder="Select an owner" />
        </div>
      </div>

      <div class="form-group">
        <app-input id="neededByDate" label="Needed By Date" type="date" formControlName="neededByDate" />
      </div>
    </div>

    <div class="dialog-footer">
      <app-button type="button" variant="stroked" (click)="onCancel()">Cancel</app-button>
      <app-button type="submit" variant="flat">
        {{ isEditing ? 'Update' : 'Add' }}
      </app-button>
    </div>
  </form>
</div>
