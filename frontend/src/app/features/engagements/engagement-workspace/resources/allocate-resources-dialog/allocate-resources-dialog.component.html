<div class="dialog-container">
  <div class="modal-header">
    <h3 class="modal-title">{{ constants.MODAL_TITLE_ALLOCATE }}</h3>
    <app-button type="button" variant="icon" ariaLabel="Close" (click)="onCancel()">
      <span class="close-icon" [inlineSVG]="'assets/icons/close.svg'"></span>
    </app-button>
  </div>

  <form [formGroup]="namesArrayHost" (ngSubmit)="onSubmit()" class="modal-form">
    <div class="modal-body">
      @if (errorMessage()) {
        <app-alert variant="danger">{{ errorMessage() }}</app-alert>
      }

      <div formArrayName="names">
        @for (control of namesArray.controls; track $index) {
          <div class="form-group">
            <app-input
              [id]="'allocation-name-' + $index"
              [label]="slotLabel($index)"
              [formControlName]="$index"
              [errorMessages]="{ required: constants.MSG_NAME_REQUIRED }"
            />
          </div>
        }
      </div>
    </div>

    <div class="modal-footer">
      <app-button type="button" variant="stroked" (click)="onCancel()" [disabled]="isSubmitting()">
        {{ constants.BTN_CANCEL }}
      </app-button>
      <app-button
        type="submit"
        variant="accent"
        [disabled]="isSubmitting() || namesArray.invalid"
        [loading]="isSubmitting()"
      >
        {{ constants.BTN_ALLOCATE }}
      </app-button>
    </div>
  </form>
</div>
