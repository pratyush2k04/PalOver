<h2 class="app-dialog__title">{{ constants.MODAL_TITLE_ALLOCATE }}</h2>

<form [formGroup]="namesArrayHost" (ngSubmit)="onSubmit()">
  <div class="app-dialog__content">
    <div formArrayName="names" class="names-list">
      @for (control of namesArray.controls; track $index) {
        <app-input
          [id]="'allocation-name-' + $index"
          [label]="slotLabel($index)"
          [formControlName]="$index"
        />
      }
    </div>
  </div>

  <div class="app-dialog__actions">
    <app-button type="button" variant="stroked" (click)="onCancel()">
      {{ constants.BTN_CANCEL }}
    </app-button>
    <app-button type="submit" variant="flat">
      {{ constants.BTN_ALLOCATE }}
    </app-button>
  </div>
</form>
