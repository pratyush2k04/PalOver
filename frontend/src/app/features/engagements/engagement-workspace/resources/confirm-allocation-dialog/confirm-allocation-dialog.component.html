<h2 class="app-dialog__title">{{ constants.MODAL_TITLE_CONFIRM }}</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="app-dialog__content">
    @if (errorMessage()) {
      <app-alert variant="danger">{{ errorMessage() }}</app-alert>
    }

    <p class="confirmation-text">
      Confirm <strong>{{ data.allocationName }}</strong> for this role.
    </p>

    <app-input
      id="confirmed-date"
      [label]="constants.LABEL_CONFIRMED_DATE"
      type="date"
      formControlName="confirmedDate"
      [errorMessages]="{ futureDate: constants.MSG_FUTURE_CONFIRMED_DATE }"
    />
  </div>

  <div class="app-dialog__actions">
    <app-button type="button" variant="stroked" (click)="onCancel()" [disabled]="isSubmitting()">
      {{ constants.BTN_CANCEL }}
    </app-button>
    <app-button
      type="submit"
      variant="accent"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
    >
      {{ constants.BTN_CONFIRM }}
    </app-button>
  </div>
</form>
