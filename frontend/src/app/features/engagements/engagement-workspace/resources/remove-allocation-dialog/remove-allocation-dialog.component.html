<div class="dialog-container">
  <div class="modal-header">
    <h3 class="modal-title">{{ constants.MODAL_TITLE_REMOVE }}</h3>
  </div>

  <form (ngSubmit)="onSubmit()" class="modal-form">
    <div class="modal-body">
      <div class="confirmation-warning">
        <p>Are you sure you want to remove <strong>{{ data.allocationName }}</strong>?</p>
        <p class="sub-text">This reopens the request to Allocated so a replacement can be named.</p>
      </div>

      @if (errorMessage()) {
        <app-alert variant="danger">{{ errorMessage() }}</app-alert>
      }

      <div class="form-group">
        <app-textarea
          id="remove-allocation-reason"
          [label]="constants.LABEL_REMOVAL_REASON"
          [rows]="4"
          [maxLength]="500"
          [ngModel]="reason()"
          (ngModelChange)="onReasonChange($event)"
          placeholder="Please enter a short reason for removing this resource (minimum 10 characters)..."
          [extraError]="minLengthError()"
        />
      </div>
    </div>

    <div class="modal-footer">
      <app-button type="button" variant="stroked" (click)="onCancel()" [disabled]="isSubmitting()">
        {{ constants.BTN_CANCEL }}
      </app-button>
      <app-button
        type="submit"
        variant="danger"
        [disabled]="isSubmitting()"
        [loading]="isSubmitting()"
      >
        {{ constants.BTN_REMOVE }}
      </app-button>
    </div>
  </form>
</div>
