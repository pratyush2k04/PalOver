<div class="dialog-container">
    <div class="modal-header">
      <h3 class="modal-title">Remove document</h3>
      <app-button type="button" variant="icon" ariaLabel="Close" (click)="onClose()">
        <span class="close-icon" [inlineSVG]="'assets/icons/close.svg'"></span>
      </app-button>
    </div>

    <div class="modal-body">
      <div class="confirmation-warning">
        <p>Are you sure you want to remove <strong>{{ data.documentName }}</strong>?</p>
        <p class="sub-text">The document will be preserved in history but hidden from normal lists.</p>
      </div>

      @if (errorMessage()) {
        <app-alert variant="danger">{{ errorMessage() }}</app-alert>
      }

      <div class="form-group">
        <app-textarea
          id="remove-reason"
          label="Reason for removal"
          [rows]="4"
          [maxLength]="500"
          [ngModel]="reason()"
          (ngModelChange)="onReasonChange($event)"
          placeholder="Please enter a short reason for removing this document (minimum 10 characters)..."
          [extraError]="minLengthError()"
        />
      </div>
    </div>

    <div class="modal-footer">
      <app-button type="button" variant="stroked" (click)="onClose()" [disabled]="isSubmitting()">
        Cancel
      </app-button>
      <app-button
        type="button"
        variant="danger"
        (click)="onSubmit()"
        [disabled]="!isValidReason()"
        [loading]="isSubmitting()"
      >
        Remove Document
      </app-button>
    </div>
</div>
