<h2 class="app-dialog__title">Version history — {{ data.fileName }}</h2>

<div class="app-dialog__content">
  @if (errorMessage()) {
    <app-alert variant="danger">{{ errorMessage() }}</app-alert>
  }

  @if (isLoading()) {
    <app-loading-spinner label="Loading versions..." />
  } @else {
    <ul class="version-list">
      @for (version of versions(); track version.id) {
        <li class="version-row">
          <button
            type="button"
            class="version-row-btn"
            (click)="onDownload(version)"
            [disabled]="downloadingId() === version.id"
          >
            <div class="version-row-header">
              <span class="version-number">v{{ version.versionNumber }}</span>
              @if (version.isCurrent) {
                <app-status-badge tone="success">Current</app-status-badge>
              }
              @if (downloadingId() === version.id) {
                <app-loading-spinner size="sm" [inline]="true" label="" />
              } @else {
                <span class="download-icon" [inlineSVG]="'assets/icons/download.svg'"></span>
              }
            </div>
            <div class="version-row-detail">
              <span class="version-uploader">{{ version.uploadedBy }}</span>
              <span class="version-date">{{ formatDate(version.uploadedAt) }}</span>
            </div>
            <p class="version-note">{{ version.changeNote || '—' }}</p>
          </button>
        </li>
      }
    </ul>
  }
</div>

<div class="app-dialog__actions">
  <app-button type="button" variant="stroked" (click)="onClose()">
    Close
  </app-button>
</div>
