<h2 class="app-dialog__title">Reason for Blocking</h2>

<form (ngSubmit)="onSubmit()">
  <div class="app-dialog__content">
    <p class="app-dialog__hint">
      Please specify why <strong>{{ data.itemName }}</strong> is blocked.
    </p>

    <app-textarea
      id="block-reason"
      label="Block Reason"
      [required]="true"
      [maxLength]="500"
      [rows]="3"
      [ngModel]="reason()"
      (ngModelChange)="onReasonChange($event)"
      name="reason"
      placeholder="e.g., Awaiting client IT admin approval"
      [extraError]="reasonError() || null"
    />
  </div>

  <div class="app-dialog__actions">
    <app-button type="button" variant="stroked" (click)="onCancel()">Cancel</app-button>
    <app-button type="submit" variant="flat">Confirm Block</app-button>
  </div>
</form>
