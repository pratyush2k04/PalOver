<h2 class="app-dialog__title">{{ isEditMode ? 'Edit Dependency Spike' : 'Add Dependency Spike' }}</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="app-dialog__content">
    <app-input
      id="dependencyName"
      label="Dependency Name"
      [required]="true"
      placeholder="e.g. Auth0 SDK, Stripe Payments, SendGrid"
      [maxLength]="200"
      formControlName="dependencyName"
    />

    <app-textarea
      id="objective"
      label="PoC Objective"
      [required]="true"
      placeholder="Describe what this proof of concept aims to evaluate..."
      [rows]="3"
      [maxLength]="1000"
      formControlName="objective"
    />

    <app-select
      id="status"
      label="Status"
      [required]="true"
      [options]="statusOptions"
      formControlName="status"
    />

    <app-textarea
      id="outcomeFindings"
      label="Outcome & Findings"
      placeholder="Document technical findings, feasibility notes, or failure reasons..."
      [rows]="3"
      [maxLength]="500"
      formControlName="outcomeFindings"
    />
  </div>

  <div class="app-dialog__actions">
    <app-button
      type="button"
      variant="stroked"
      [disabled]="isSubmitting()"
      (click)="onCancel()"
    >
      Cancel
    </app-button>
    <app-button
      type="submit"
      variant="flat"
      [loading]="isSubmitting()"
      [disabled]="isSubmitting()"
    >
      {{ isEditMode ? 'Save Changes' : 'Create Spike' }}
    </app-button>
  </div>
</form>
