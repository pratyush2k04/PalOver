<div class="dialog-container">
  <div class="dialog-header">
    <h3>Change Owner</h3>
  </div>

  <div class="dialog-body">
    <p class="dialog-hint">
      Select a new owner for <strong>{{ itemName() }}</strong>.
    </p>

    <div class="form-group">
      <label for="ownerSelect">Owner</label>
      
      @if (isLoading()) {
        <app-loading-spinner label="Loading users..." />
      } @else {
        <select 
          id="ownerSelect" 
          class="form-control" 
          [ngModel]="selectedOwnerId()" 
          (ngModelChange)="selectedOwnerId.set($event)">
          <option [ngValue]="null" disabled>Select an owner...</option>
          @for (user of users(); track user.id) {
            <option [ngValue]="user.id">{{ user.fullName }} ({{ user.email }})</option>
          }
        </select>
      }
    </div>
  </div>

  <div class="dialog-footer">
    <app-button type="button" variant="stroked" (click)="onCancel()">Cancel</app-button>
    <app-button type="button" variant="flat" [disabled]="!selectedOwnerId() || isLoading()" (click)="onSubmit()">Save</app-button>
  </div>
</div>
