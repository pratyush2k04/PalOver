<h2 class="app-dialog__title">Add Code Review / Architecture Finding</h2>

<form (ngSubmit)="onSubmit()">
  <div class="app-dialog__content">
    <app-input
      id="finding-title"
      label="Title"
      [required]="true"
      [maxLength]="200"
      [ngModel]="title()"
      (ngModelChange)="onTitleChange($event)"
      name="findingTitle"
      placeholder="e.g., High Database Coupling"
      [extraError]="titleError() || null"
    />

    <app-select
      id="finding-severity"
      label="Severity"
      [required]="true"
      [options]="severityOptions"
      [ngModel]="severity()"
      (ngModelChange)="severity.set($event)"
      name="findingSeverity"
    />

    <app-textarea
      id="finding-desc"
      label="Description"
      [required]="true"
      [maxLength]="1000"
      [ngModel]="description()"
      (ngModelChange)="onDescriptionChange($event)"
      name="findingDesc"
      placeholder="Detailed observations and findings..."
      [extraError]="descriptionError() || null"
    />

    @if (documentsLoading()) {
      <app-loading-spinner size="sm" [inline]="true" label="Loading documents..." />
    } @else {
      <app-select
        id="finding-doc"
        label="Link Document"
        [options]="documentOptions()"
        [ngModel]="documentId()"
        (ngModelChange)="documentId.set($event)"
        name="findingDoc"
      />
    }
  </div>

  <div class="app-dialog__actions">
    <app-button type="button" variant="stroked" (click)="onCancel()">Cancel</app-button>
    <app-button type="submit" variant="flat">Save Finding</app-button>
  </div>
</form>
