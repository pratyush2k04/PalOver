<h2 class="app-dialog__title">{{ constants.MODAL_LOG_TITLE }}</h2>

<form [formGroup]="logForm" (ngSubmit)="onSubmit()">
  <div class="app-dialog__content">
    @if (errorMessage()) {
      <app-alert>{{ errorMessage() }}</app-alert>
    }

    <app-textarea
      id="description"
      [label]="constants.LABEL_DESCRIPTION"
      [required]="true"
      formControlName="description"
      [rows]="3"
      [errorMessages]="{
        required: constants.ERROR_DESCRIPTION_REQUIRED,
        minlength: constants.ERROR_DESCRIPTION_MINLENGTH
      }"
    />

    <app-input
      id="impact"
      [label]="constants.LABEL_IMPACT"
      [required]="true"
      formControlName="impact"
      [errorMessages]="{
        required: constants.ERROR_IMPACT_REQUIRED,
        minlength: constants.ERROR_IMPACT_MINLENGTH
      }"
    />
  </div>

  <div class="app-dialog__actions">
    <app-button type="button" variant="stroked" [disabled]="isSubmitting()" (click)="onCancel()">
      {{ constants.BTN_CANCEL }}
    </app-button>
    <app-button type="submit" variant="flat" [disabled]="isSubmitting()" [loading]="isSubmitting()">
      {{ constants.BTN_LOG }}
    </app-button>
  </div>
</form>
