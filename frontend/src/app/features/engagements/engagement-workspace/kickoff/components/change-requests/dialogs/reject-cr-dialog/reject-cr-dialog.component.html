<h2 class="app-dialog__title">{{ constants.MODAL_REJECT_TITLE }}</h2>

<form [formGroup]="rejectForm" (ngSubmit)="onSubmit()">
  <div class="app-dialog__content">
    <app-textarea
      id="rejectionReason"
      [label]="constants.LABEL_REASON_REQUIRED"
      [required]="true"
      formControlName="rejectionReason"
      [rows]="4"
      [errorMessages]="{ required: constants.ERROR_REASON_REQUIRED }"
    />
  </div>

  <div class="app-dialog__actions">
    <app-button type="button" variant="stroked" (click)="onCancel()">
      {{ constants.BTN_CANCEL }}
    </app-button>
    <app-button type="submit" variant="danger">
      {{ constants.BTN_REJECT }}
    </app-button>
  </div>
</form>
