<div class="dialog-container">
  <div class="dialog-header">
    <h3>{{ constants.MODAL_REJECT_TITLE }}</h3>
  </div>

  <form [formGroup]="rejectForm" (ngSubmit)="onSubmit()">
    <div class="dialog-body">
      @if (errorMessage()) {
        <app-alert variant="danger">{{ errorMessage() }}</app-alert>
      }

      <div class="form-group">
        <app-textarea
          id="rejectionReason"
          [label]="constants.LABEL_REASON_REQUIRED"
          formControlName="rejectionReason"
          [rows]="4"
          [errorMessages]="{ required: constants.ERROR_REASON_REQUIRED }"
        />
      </div>
    </div>

    <div class="dialog-footer">
      <app-button type="button" variant="stroked" (click)="onCancel()">
        {{ constants.BTN_CANCEL }}
      </app-button>
      <app-button type="submit" variant="danger" [disabled]="isSubmitting()">
        {{ constants.BTN_REJECT }}
      </app-button>
    </div>
  </form>
</div>
