<div class="dialog-container">
  <div class="dialog-header">
    <h3>{{ constants.MODAL_REASON_VIEW_TITLE }}</h3>
  </div>

  <div class="dialog-body">
    <p class="reason-text">{{ data.reason }}</p>
  </div>

  <div class="dialog-footer">
    <app-button type="button" variant="stroked" (click)="onClose()">
      {{ constants.BTN_CLOSE }}
    </app-button>
  </div>
</div>
