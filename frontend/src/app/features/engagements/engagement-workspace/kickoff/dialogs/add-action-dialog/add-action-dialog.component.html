<div class="dialog-container">
  <div class="dialog-header">
    <h2>Add action item</h2>
  </div>

  <div class="dialog-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <app-input
          id="action-title"
          label="Action"
          formControlName="title"
          [errorMessages]="{ required: messages.ACTION_TITLE_REQUIRED }"
        />
      </div>

      <div class="form-group">
        <app-input
          id="action-owner"
          label="Owner"
          formControlName="ownerName"
          [errorMessages]="{ required: messages.OWNER_NAME_REQUIRED }"
        />
      </div>

      <div class="form-group">
        <app-input
          id="action-due-date"
          type="date"
          label="Due date"
          formControlName="dueDate"
          [errorMessages]="{ required: messages.DUE_DATE_REQUIRED }"
        />
      </div>

      <div class="dialog-actions">
        <app-button type="button" variant="stroked" (click)="onCancel()">Cancel</app-button>
        <app-button type="submit" variant="flat">Add</app-button>
      </div>
    </form>
  </div>
</div>
