<h2 class="app-dialog__title">{{ isEditMode ? 'Edit Risk' : 'Record New Risk' }}</h2>

<form [formGroup]="riskForm" (ngSubmit)="onSubmit()">
  <div class="app-dialog__content">
    <app-input
      id="title"
      label="Risk Title"
      [required]="true"
      formControlName="title"
      placeholder="Short descriptive title of the risk"
      
    />

    <app-textarea
      id="description"
      label="Description"
      [required]="true"
      formControlName="description"
      [rows]="3"
      placeholder="Detailed explanation of potential risk impact and context"
    />

    <div class="form-row">
      <div class="col">
        <app-select
          id="impact"
          label="Impact"
          [required]="true"
          formControlName="impact"
          [options]="impactOptions"
        />
      </div>

      <div class="col">
        <app-select
          id="likelihood"
          label="Likelihood"
          [required]="true"
          formControlName="likelihood"
          [options]="likelihoodOptions"
        />
      </div>
    </div>

    <div class="form-row">
      <div class="col">
        <app-select
          id="ownerId"
          label="Owner"
          [required]="true"
          formControlName="ownerId"
          [options]="ownerSelectOptions"
        />
      </div>

      @if (isEditMode) {
        <div class="col">
          <app-select
            id="status"
            label="Status"
            [required]="true"
            formControlName="status"
            [options]="statusEditOptions"
          />
        </div>
      }
    </div>

    <app-textarea
      id="mitigation"
      label="Mitigation Plan"
      formControlName="mitigation"
      [rows]="3"
      placeholder="Actions taken or planned to reduce or eliminate the risk"
      [maxLength]="2000"
    />
  </div>

  <div class="app-dialog__actions">
    <app-button type="button" variant="stroked" (click)="onCancel()">Cancel</app-button>
    <app-button type="submit" variant="flat">
      {{ isEditMode ? 'Update Risk' : 'Save Risk' }}
    </app-button>
  </div>
</form>
