<div class="dialog-container">
  <div class="dialog-header">
    <h2>Review Exemption Request</h2>
    <button type="button" class="close-btn" (click)="onCancel()" aria-label="Close dialog">&times;</button>
  </div>

  <div class="dialog-body">
    <div class="item-title-preview">
      <strong>Item:</strong> {{ data.itemTitle }}
    </div>

    <div class="reason-card">
      <div class="reason-label">Project Manager's Justification:</div>
      <p class="reason-text">{{ data.reason }}</p>
    </div>

    @if (!isRejectMode()) {
      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="onShowRejectMode()">Reject Exemption</button>
        <button type="button" class="btn btn-success" (click)="onApprove()">Approve Exemption</button>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onConfirmReject()">
        <div class="form-group">
          <label for="rejection-reason">Rejection Feedback (Optional)</label>
          <textarea
            id="rejection-reason"
            formControlName="rejectionReason"
            rows="3"
            placeholder="Optionally provide feedback explaining why the exemption request was rejected...">
          </textarea>
        </div>

        <div class="dialog-actions">
          <button type="button" class="btn btn-secondary" (click)="isRejectMode.set(false)">Back</button>
          <button type="submit" class="btn btn-danger">Confirm Rejection</button>
        </div>
      </form>
    }
  </div>
</div>
