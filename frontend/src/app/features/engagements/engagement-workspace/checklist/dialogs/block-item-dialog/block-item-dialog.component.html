<div class="dialog-container">
  <div class="dialog-header">
    <h2>Flag as Blocked</h2>
    <app-button type="button" variant="icon" ariaLabel="Close dialog" (click)="onCancel()">&times;</app-button>
  </div>

  <div class="dialog-body">
    <p class="item-title-preview">
      <strong>Item:</strong> {{ data.itemTitle }}
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <app-textarea
          id="block-reason"
          label="Reason for blocking"
          formControlName="reason"
          [rows]="4"
          [maxLength]="500"
          placeholder="Describe what's blocking this item..."
          [errorMessages]="{
            required: 'A reason is required.',
            minlength: 'Reason must be at least 10 characters long.',
            maxlength: 'Reason cannot exceed 500 characters.'
          }"
        />
      </div>

      <div class="form-group">
        <app-select
          id="block-owner"
          label="Owner"
          formControlName="personId"
          [options]="ownerOptions"
          [errorMessages]="{ required: 'An owner is required.' }"
        />
      </div>

      <div class="dialog-actions">
        <app-button type="button" variant="stroked" (click)="onCancel()">Cancel</app-button>
        <app-button type="submit" variant="flat" [disabled]="form.invalid">Flag as Blocked</app-button>
      </div>
    </form>
  </div>
</div>
