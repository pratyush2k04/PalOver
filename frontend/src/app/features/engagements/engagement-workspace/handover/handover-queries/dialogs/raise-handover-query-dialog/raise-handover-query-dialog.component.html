<div class="dialog-container">
  <div class="dialog-header">
    <h3>Raise a Query</h3>
    <app-button type="button" variant="icon" ariaLabel="Close" (click)="onCancel()">&times;</app-button>
  </div>

  <div class="dialog-body">
    <app-select
      id="query-field-section"
      label="Field"
      [options]="fieldSectionOptions"
      [ngModel]="fieldSection()"
      (ngModelChange)="onFieldSectionChange($event)"
      [ngModelOptions]="{ standalone: true }"
    />

    <app-select
      *ngIf="isCommitmentSection()"
      id="query-commitment"
      label="Commitment"
      [options]="commitmentOptions()"
      [ngModel]="referenceId()"
      (ngModelChange)="referenceId.set($event)"
      [ngModelOptions]="{ standalone: true }"
    />

    <app-textarea
      id="query-question"
      label="Question"
      placeholder="What would you like to ask?"
      [rows]="4"
      [maxLength]="2000"
      [ngModel]="question()"
      (ngModelChange)="question.set($event)"
      [ngModelOptions]="{ standalone: true }"
    />

    <app-alert *ngIf="errorMessage()" variant="danger">{{ errorMessage() }}</app-alert>
  </div>

  <div class="dialog-footer">
    <app-button type="button" variant="stroked" [disabled]="isSubmitting()" (click)="onCancel()">Cancel</app-button>
    <app-button type="button" variant="accent" [disabled]="!canSubmit() || isSubmitting()" (click)="onSubmit()">
      {{ isSubmitting() ? 'Raising...' : 'Raise Query' }}
    </app-button>
  </div>
</div>
