<div class="dialog-container">
  <div class="dialog-header">
    <h3>Reason for Blocking</h3>
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="dialog-body">
      <p class="dialog-hint">
        Please specify why <strong>{{ data.itemName }}</strong> is blocked.
      </p>
      <div class="form-group">
        <app-textarea
          id="block-reason"
          label="Block Reason"
          [required]="true"
          [rows]="3"
          [ngModel]="reason()"
          (ngModelChange)="onReasonChange($event)"
          name="reason"
          placeholder="Explain why this readiness item is blocked..."
          [extraError]="reasonError() || null"
        />
      </div>
    </div>

    <div class="dialog-footer">
      <app-button type="button" variant="stroked" (click)="onCancel()">Cancel</app-button>
      <app-button type="submit" variant="flat">Confirm Block</app-button>
    </div>
  </form>
</div>
