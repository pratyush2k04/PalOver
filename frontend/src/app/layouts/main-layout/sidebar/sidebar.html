<aside class="sidebar">
  <div class="logo">
    <span class="logo-badge" title="Project Delivery Readiness">
      <span [inlineSVG]="'assets/icons/check.svg'"></span>
    </span>
  </div>

  <nav class="nav-items">
    @for (item of navItems(); track item.label) {
      <a class="nav-item"
         [routerLink]="item.route"
         routerLinkActive="active">
        <div class="icon-wrapper">
          <span [inlineSVG]="'assets/icons/' + item.icon + '.svg'"></span>
        </div>
        <span class="label">{{ item.label }}</span>
      </a>
    }
  </nav>

</aside>
