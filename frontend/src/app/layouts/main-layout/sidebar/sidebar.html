<aside class="sidebar" [class.mobile-open]="layoutService.isMobileSidebarOpen()">
  <div class="logo">
    <img src="image.png" alt="Project Delivery Readiness" class="logo-image" title="Project Delivery Readiness" />
  </div>

  <nav class="nav-items">
    @for (item of navItems(); track item.label) {
      <a class="nav-item"
         [routerLink]="item.route"
         routerLinkActive="active"
         (click)="layoutService.closeSidebar()">
        <div class="icon-wrapper">
          <span [inlineSVG]="'assets/icons/' + item.icon + '.svg'"></span>
        </div>
        <span class="label">{{ item.label }}</span>
      </a>
    }
  </nav>

</aside>
