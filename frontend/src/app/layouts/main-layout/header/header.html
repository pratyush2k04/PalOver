<header class="header">
  <div class="search-box">
    <span class="search-icon">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </span>
    <input type="text" placeholder="Search engagements, documents, people, checklist items..." />
  </div>

  @if (user(); as currentUser) {
    <div class="header-actions">
      @if (workspace()?.welcomeMessage; as welcomeMsg) {
        <div class="welcome-message">{{ welcomeMsg }}</div>
      }

      <button class="notification-button" type="button" title="Notifications">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notification-badge">3</span>
      </button>

      <div class="user-info">
        <app-avatar [name]="currentUser.fullName" />
        <div class="user-text">
          <span class="user-name">{{ currentUser.fullName }}</span>
          <span class="user-role">{{ currentUser.role }}</span>
        </div>
        <span class="chevron">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </span>
      </div>
    </div>
  }
</header>
