<div class="autocomplete">
  <input
    type="text"
    class="autocomplete__input"
    [placeholder]="placeholder()"
    [value]="searchTerm()"
    (input)="onInput($any($event.target).value)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />
  @if (isOpen()) {
    <div class="autocomplete__panel">
      @if (options().length === 0) {
        <div class="autocomplete__empty">{{ emptyMessage() }}</div>
      } @else {
        @for (option of options(); track option.id) {
          <div class="autocomplete__option" (mousedown)="selectOption(option)">
            {{ option.label }}
          </div>
        }
      }
    </div>
  }
</div>
