<div class="app-field" [class.app-field--invalid]="showError">
  @if (label()) {
    <label [for]="id()">{{ label() }}</label>
  }
  <select
    [id]="id()"
    [disabled]="disabled"
    [class.is-invalid]="showError"
    [value]="selectedIndex === null ? '' : selectedIndex"
    (change)="onSelectChange($any($event.target).value)"
    (blur)="markTouched()"
  >
    @if (placeholder()) {
      <option value="" disabled>{{ placeholder() }}</option>
    }
    @for (option of options(); track option.value; let i = $index) {
      <option [value]="i">{{ option.label }}</option>
    }
  </select>
  @if (showError) {
    <span class="app-field__error">{{ errorMessage }}</span>
  }
</div>
