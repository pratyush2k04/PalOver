<div class="app-field" [class.app-field--invalid]="showError" [class.app-field--open]="isOpen()">
  @if (label()) {
    <label [for]="id()" (click)="toggleDropdown()">
      {{ label() }}
      @if (required()) {
        <span class="required-asterisk">*</span>
      }
    </label>
  }

  <div class="select-wrapper">
    <button
      type="button"
      [id]="id()"
      class="select-trigger"
      [class.is-invalid]="showError"
      [class.is-open]="isOpen()"
      [class.is-placeholder]="isPlaceholder()"
      [disabled]="disabled()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-haspopup]="'listbox'"
      role="combobox"
      (click)="toggleDropdown()"
    >
      <span class="select-trigger__text">{{ displayLabel() }}</span>
      <span
        class="select-trigger__chevron"
        [class.is-open]="isOpen()"
        [inlineSVG]="'assets/icons/chevron-down.svg'"
      ></span>
    </button>

    @if (isOpen()) {
      <div class="select-dropdown" 
           role="listbox" 
           [attr.aria-labelledby]="id()"
           [style.position]="'fixed'"
           [style.top.px]="dropdownTop"
           [style.left.px]="dropdownLeft"
           [style.min-width.px]="dropdownMinWidth">
        @for (option of options(); track option.value; let i = $index) {
          <button type="button"
            class="select-option"
            [class.is-selected]="selectedIndex() === i"
            role="option"
            [attr.aria-selected]="selectedIndex() === i"
            (click)="selectOption(i)"
          >
            <span class="select-option__label">{{ option.label }}</span>
            @if (selectedIndex() === i) {
              <span class="select-option__check" [inlineSVG]="'assets/icons/check.svg'"></span>
            }
          </button>
        }
      </div>
    }
  </div>

  @if (showError) {
    <span class="app-field__error">{{ errorMessage }}</span>
  }
</div>
