<div class="app-field" [class.app-field--invalid]="showError">
  @if (label()) {
    <label [for]="id()">{{ label() }}</label>
  }
  <div class="input-wrapper" [class.is-invalid]="showError" [class.is-disabled]="disabled()">
    @if (prefixText()) {
      <span class="input-prefix">{{ prefixText() }}</span>
    }
    <input
      [id]="id()"
      [type]="type()"
      [placeholder]="placeholder()"
      [attr.maxlength]="maxLength()"
      [attr.min]="min()"
      [attr.step]="step()"
      [value]="value"
      [disabled]="disabled()"
      (input)="onInput($any($event.target).value)"
      (blur)="markTouched()"
    />
  </div>
  @if (showCounter()) {
    <div class="char-counter" [class.char-counter--danger]="counterDanger()">
      {{ value.length }}/{{ maxLength() }}
    </div>
  }
  @if (showError) {
    <span class="app-field__error">{{ errorMessage }}</span>
  }
</div>
