<div class="app-field" [class.app-field--invalid]="showError">
  @if (label()) {
    <label [for]="id()">
      {{ label() }}
      @if (required()) {
        <span class="required-asterisk">*</span>
      }
    </label>
  }
  <div class="input-wrapper">
    <input
      [id]="id()"
      [type]="currentType()"
      [placeholder]="placeholder()"
      [attr.maxlength]="maxLength()"
      [attr.min]="min()"
      [attr.step]="step()"
      [value]="value"
      [disabled]="disabled()"
      [class.is-invalid]="showError"
      (input)="onInput($any($event.target).value)"
      (blur)="markTouched()"
    />
    @if (type() === 'password') {
      <button
        type="button"
        class="password-toggle-btn"
        [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
        (click)="togglePasswordVisibility()"
      >
        <span
          class="toggle-icon"
          [inlineSVG]="isPasswordVisible() ? 'assets/icons/eye-off.svg' : 'assets/icons/eye.svg'"
        ></span>
      </button>
    }
  </div>
  @if (showError || showCounter()) {
    <div class="app-field__footer">
      @if (showError) {
        <span class="app-field__error">{{ errorMessage }}</span>
      }
      @if (showCounter()) {
        <div class="char-counter" [class.char-counter--danger]="counterDanger()">
          {{ value.length }}/{{ maxLength() }}
        </div>
      }
    </div>
  }
</div>
