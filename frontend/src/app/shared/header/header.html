<header class="header">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Search engagements, documents, people, checklist items..." />
  </div>

  @if (user(); as currentUser) {
    <div class="header-actions">
      <div class="welcome-message">{{ workspace()?.welcomeMessage }}</div>

      <div class="user-info">
        <span class="avatar">{{ initials(currentUser.fullName) }}</span>
        <div class="user-text">
          <span class="user-name">{{ currentUser.fullName }}</span>
          <span class="user-role">{{ currentUser.role }}</span>
        </div>
        <span class="chevron">⌄</span>
      </div>
    </div>
  }
</header>
