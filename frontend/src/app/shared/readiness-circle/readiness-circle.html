<div
  class="readiness-circle"
  [class.readiness-circle--sm]="size() === 'sm'"
  [class.readiness-circle--md]="size() === 'md'"
  [class.readiness-circle--lg]="size() === 'lg'"
  [class.readiness-circle--danger]="tone() === 'danger'"
  [class.readiness-circle--warning]="tone() === 'warning'"
  [class.readiness-circle--success]="tone() === 'success'"
>
  <svg viewBox="0 0 100 100" class="ring-svg">
    <circle cx="50" cy="50" r="40" class="ring-track" />
    <circle
      cx="50"
      cy="50"
      r="40"
      class="ring-progress"
      [style.strokeDasharray]="251.3"
      [style.strokeDashoffset]="strokeDashoffset()"
    />
  </svg>
  <span class="ring-text">{{ scorePercent() }}%</span>
</div>
