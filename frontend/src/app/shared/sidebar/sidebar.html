<aside class="sidebar">
  <div class="logo">
    <span class="logo-badge">✓</span>
  </div>

  <nav class="nav-items">
    @if (workspace(); as ws) {
      <a class="nav-item" [routerLink]="ws.route" routerLinkActive="active">
        <div class="icon-wrapper">
          <span class="icon">{{ iconGlyph('home') }}</span>
        </div>
        <span class="label">{{ ws.title }}</span>
      </a>
    }
  </nav>

  <div class="sign-out" (click)="onSignOut()">
    <div class="icon-wrapper">
      <span class="icon">{{ iconGlyph('sign-out') }}</span>
    </div>
    <span class="label">Sign Out</span>
  </div>
</aside>
