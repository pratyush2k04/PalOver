@if (flaggedItems().length > 0) {
  <div class="flagged-items-banner">
    @for (item of flaggedItems(); track item.label) {
      <p>
        <span class="icon" [inlineSVG]="'assets/icons/alert-triangle.svg'"></span>
        <span>{{ item.count }} {{ item.label }}</span>
      </p>
    }
  </div>
} @else {
  <div class="flagged-items-banner flagged-items-banner-clear">
    <p>
      <span class="icon" [inlineSVG]="'assets/icons/check-circle.svg'"></span>
      <span>{{ allClearMessage() }}</span>
    </p>
  </div>
}
